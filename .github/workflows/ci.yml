name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fetch long-tail grammars for the language tests
        run: node scripts/fetch-grammars.mjs
      - run: npm test
      - name: Smoke-index the repository itself
        run: node bin/symbra.js index . -q && node bin/symbra.js overview -c 3
      - name: Pack
        run: npm pack --dry-run
