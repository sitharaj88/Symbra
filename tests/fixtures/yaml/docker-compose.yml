services:
  # The public API.
  api:
    image: ghcr.io/acme/api:1.2.3
    depends_on:
      - db
      - cache
    environment:
      DATABASE_URL: postgres://db/app
      LOG_LEVEL: info
    env_file:
      - ./api.env

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=secret

  cache:
    image: redis:7
